<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Giroscopio · Vista previa</title>
<style>
  :root{
    --bg:#050308;
    --accent-1:#b24bff;
    --accent-2:#3fb8ff;
    --text:#eae6f5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:"Helvetica Neue", Arial, sans-serif; color:var(--text);}
  canvas{display:block;touch-action:none;}

  #topbar{
    position:fixed; top:18px; left:0; right:0; z-index:10;
    display:flex; justify-content:center; pointer-events:none;
  }
  #title{
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
    color:rgba(234,230,245,0.55);
    border:1px solid rgba(234,230,245,0.18);
    padding:6px 14px; border-radius:999px;
    background:rgba(5,3,8,0.35); backdrop-filter: blur(6px);
  }

  #hint{
    position:fixed; bottom:20px; left:0; right:0; z-index:10;
    text-align:center; font-size:12px; color:rgba(234,230,245,0.5);
    pointer-events:none;
  }

  #loading{
    position:fixed; inset:0; z-index:30;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); transition: opacity .5s ease;
  }
  #loading span{ font-size:12px; letter-spacing:0.25em; text-transform:uppercase; color:rgba(234,230,245,0.5); }

  #errBox{
    position:fixed; left:16px; right:16px; bottom:56px; z-index:50;
    display:none; background:rgba(120,10,20,0.92); color:#fff;
    padding:12px 14px; border-radius:10px; font-size:12px; line-height:1.5;
    white-space:pre-wrap; word-break:break-word;
  }
</style>
</head>
<body>

<div id="loading"><span>Cargando escena…</span></div>
<div id="errBox"></div>
<div id="topbar"><div id="title">Giroscopio · Vista previa</div></div>
<div id="hint">Arrastra para orbitar · pellizca / rueda para zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

function showError(msg){
  const box = document.getElementById("errBox");
  box.style.display = "block";
  box.textContent = "Error: " + msg;
  const loading = document.getElementById("loading");
  if (loading) loading.remove();
}
window.addEventListener("error", (e)=> showError(e.message || String(e)));
window.addEventListener("unhandledrejection", (e)=> showError((e.reason && e.reason.message) || String(e.reason)));

let camera, scene, renderer, composer, controls, gyro, glowDisc;
const clock = new THREE.Clock();

init();

function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050308);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.01, 40);
  camera.position.set(0, 0.2, 1.3);

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x554466, 0.8));
  const key = new THREE.PointLight(0xb24bff, 3, 6, 2);
  key.position.set(0, 0.3, 0);
  scene.add(key);
  const rim = new THREE.PointLight(0x3fb8ff, 2, 6, 2);
  rim.position.set(0.4, 0.2, -0.4);
  scene.add(rim);

  // subtle floor so the object has something to sit above, like the reference photo
  const floorGeo = new THREE.PlaneGeometry(6, 6);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x0d0a12, roughness: 0.6, metalness: 0.2 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -0.32;
  scene.add(floor);

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.9, 0.15);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  gyro = buildGyroscope();
  scene.add(gyro);

  glowDisc = buildGlowDisc();
  glowDisc.position.set(0, -0.31, 0);
  scene.add(glowDisc);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0,0,0);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;
  controls.minDistance = 0.5;
  controls.maxDistance = 4;

  window.addEventListener("resize", onResize);
  renderer.domElement.addEventListener("pointerdown", ()=> controls.autoRotate = false);

  document.getElementById("loading").style.opacity = 0;
  setTimeout(()=> document.getElementById("loading").remove(), 500);

  renderer.setAnimationLoop(render);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}

function buildGyroscope(){
  const group = new THREE.Group();

  const ringMat = new THREE.MeshStandardMaterial({
    color: 0x1c1622, metalness: 0.7, roughness: 0.3,
    emissive: 0x2a1440, emissiveIntensity: 0.35
  });

  const ringSpecs = [
    { r: 0.30, tube: 0.012, tiltX: 0.2,  tiltZ: 0.0,  axis: new THREE.Vector3(0,1,0), speed: 0.35 },
    { r: 0.26, tube: 0.011, tiltX: 1.1,  tiltZ: 0.3,  axis: new THREE.Vector3(1,0.2,0), speed: -0.5 },
    { r: 0.22, tube: 0.010, tiltX: 0.6,  tiltZ: 1.3,  axis: new THREE.Vector3(0.3,0.4,1), speed: 0.65 },
  ];

  const rings = [];
  ringSpecs.forEach(spec=>{
    const geo = new THREE.TorusGeometry(spec.r, spec.tube, 16, 96);
    const mesh = new THREE.Mesh(geo, ringMat);
    mesh.rotation.x = spec.tiltX;
    mesh.rotation.z = spec.tiltZ;
    mesh.userData.axis = spec.axis.normalize();
    mesh.userData.speed = spec.speed;
    group.add(mesh);
    rings.push(mesh);
  });
  group.userData.rings = rings;

  const core = new THREE.Group();
  const coreColors = [0xb24bff, 0x3fb8ff, 0xff5fa8, 0xffa64b];
  const blades = [];
  for (let i=0;i<7;i++){
    const len = 0.34 + Math.random()*0.08;
    const geo = new THREE.PlaneGeometry(0.012, len);
    const color = coreColors[i % coreColors.length];
    const mat = new THREE.MeshBasicMaterial({
      color, transparent:true, opacity:0.9, blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide, depthWrite:false
    });
    const blade = new THREE.Mesh(geo, mat);
    blade.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    blade.userData.axis = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
    blade.userData.speed = 0.4 + Math.random()*0.8;
    core.add(blade);
    blades.push(blade);
  }
  group.userData.blades = blades;

  const icoGeo = new THREE.IcosahedronGeometry(0.11, 1);
  const icoMat = new THREE.MeshBasicMaterial({
    color: 0xe6d8ff, wireframe:true, transparent:true, opacity:0.5,
    blending: THREE.AdditiveBlending, depthWrite:false
  });
  const ico = new THREE.Mesh(icoGeo, icoMat);
  core.add(ico);
  group.userData.ico = ico;

  const sparkCount = 140;
  const positions = new Float32Array(sparkCount*3);
  const colors = new Float32Array(sparkCount*3);
  const tmpColor = new THREE.Color();
  for (let i=0;i<sparkCount;i++){
    const r = 0.06 + Math.random()*0.14;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    positions[i*3]   = r*Math.sin(phi)*Math.cos(theta);
    positions[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
    positions[i*3+2] = r*Math.cos(phi);
    tmpColor.setHSL(0.72 + Math.random()*0.25, 1.0, 0.6 + Math.random()*0.2);
    colors[i*3]=tmpColor.r; colors[i*3+1]=tmpColor.g; colors[i*3+2]=tmpColor.b;
  }
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute("position", new THREE.BufferAttribute(positions,3));
  sparkGeo.setAttribute("color", new THREE.BufferAttribute(colors,3));
  const sparkMat = new THREE.PointsMaterial({
    size: 0.006, vertexColors:true, transparent:true, opacity:0.85,
    blending: THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
  });
  const sparks = new THREE.Points(sparkGeo, sparkMat);
  core.add(sparks);
  group.userData.sparks = sparks;

  const coreLight = new THREE.PointLight(0xb24bff, 2.2, 1.2, 2);
  core.add(coreLight);

  group.add(core);
  group.userData.core = core;

  return group;
}

function buildGlowDisc(){
  const size = 512;
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  grad.addColorStop(0.0, "rgba(178,75,255,0.55)");
  grad.addColorStop(0.35,"rgba(63,184,255,0.30)");
  grad.addColorStop(0.65,"rgba(255,95,168,0.14)");
  grad.addColorStop(1.0, "rgba(0,0,0,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent:true, blending: THREE.AdditiveBlending, depthWrite:false
  });
  const geo = new THREE.PlaneGeometry(0.9, 0.9);
  const disc = new THREE.Mesh(geo, mat);
  disc.rotation.x = -Math.PI/2;
  return disc;
}

function render(){
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  gyro.userData.rings.forEach(r=> r.rotateOnAxis(r.userData.axis, r.userData.speed*dt));
  gyro.userData.blades.forEach(b=>{
    b.rotateOnAxis(b.userData.axis, b.userData.speed*dt);
    b.material.opacity = 0.55 + 0.45*Math.sin(t*3 + b.id);
  });
  gyro.userData.ico.rotation.y += dt*0.6;
  gyro.userData.ico.rotation.x += dt*0.3;
  gyro.userData.core.rotation.y += dt*0.15;
  gyro.userData.sparks.rotation.y -= dt*0.1;

  const pulse = 0.85 + 0.15*Math.sin(t*1.6);
  glowDisc.scale.setScalar(pulse);

  controls.update();
  composer.render();
}
</script>
</body>
</html>
